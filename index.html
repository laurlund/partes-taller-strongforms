<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strongforms — Control Final v4.1</title>
    <link rel="stylesheet" href="[link removed]">
    <style>
        :root { --bg: #FFFFFF; --txt: #000000; --acc: #D35400; --border: #000000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--txt); }
        header { padding: 15px; background: #000; color: #FFF; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        main { padding: 15px; padding-bottom: 90px; max-width: 800px; margin: 0 auto; }
        .pg { display: none; } .pg.active { display: block; }
        .card { border: 3px solid var(--border); padding: 15px; margin-bottom: 15px; background: #FFF; }
        h2 { margin: 0 0 15px 0; font-size: 22px; border-bottom: 3px solid #000; padding-bottom: 5px; text-transform: uppercase; }
        .grid-w { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-w { padding: 20px; border: 3px solid var(--border); background: #FFF; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-weight: bold; }
        .ini { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; color: #FFF; margin-bottom: 10px; font-size: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 3px solid var(--border); font-size: 16px; font-weight: bold; margin-bottom: 15px; background: #FFF; color: #000; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .chip { padding: 10px; border: 2px solid #000; font-weight: bold; cursor: pointer; font-size: 13px; }
        .chip.active { background: var(--acc); color: #FFF; border-color: var(--acc); }
        nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 0; }
        nav button { background: none; border: none; color: #AAA; display: flex; flex-direction: column; align-items: center; font-weight: bold; font-size: 10px; }
        nav button.active { color: #FFF; }
        .btn-main { width: 100%; padding: 18px; background: #000; color: #FFF; font-weight: bold; font-size: 18px; border: none; text-transform: uppercase; cursor: pointer; }
        .btn-sec { background: #FFF; color: #000; border: 3px solid #000; margin-top: 8px; }
        #modalPin { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index: 1000; }
        .pin-box { background: #FFF; padding: 25px; border: 5px solid var(--acc); width: 90%; max-width: 350px; text-align:center; }
        .bar-container { margin-bottom: 15px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .bar-bg { background: #EEE; border: 1px solid #000; height: 16px; }
        .bar-fill { background: var(--acc); height: 100%; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900;">STRONGFORMS</div>
    <div id="statusBadge" class="badge">CONECTADO</div>
</header>

<main>
    <!-- SECCIONES DE NAVEGACIÓN -->
    <div id="vSel" class="pg active">
        <h2 style="text-align: center;">ELEGIR NOMBRE</h2>
        <div id="workerGrid" class="grid-w"></div>
    </div>

    <div id="vDash" class="pg">
        <h2>PANEL DE CONTROL</h2>
        <div class="card">
            <label>FILTRAR POR CLIENTE</label>
            <select id="fCli" onchange="renderDash()"></select>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>DESDE</label><input type="date" id="fDesde" onchange="renderDash()"></div>
                <div><label>HASTA</label><input type="date" id="fHasta" onchange="renderDash()"></div>
            </div>
            <button class="btn-main btn-sec" onclick="resetFilters()">MOSTRAR TODO MAYO</button>
        </div>
        <div class="card" style="display: flex; justify-content: space-around; background: #000; color: #FFF; padding: 20px;">
            <div style="text-align: center;"><div id="stHoras" style="font-size: 32px; font-weight: 900;">0</div><div>HORAS</div></div>
            <div style="text-align: center;"><div id="stPartes" style="font-size: 32px; font-weight: 900;">0</div><div>PARTES</div></div>
        </div>
        <div class="card"><h3>HORAS POR EQUIPO</h3><div id="chartWorkers"></div></div>
        <div class="card"><h3>HORAS POR CLIENTE</h3><div id="chartClients"></div></div>
        <button class="btn-main" onclick="syncAll()">SINCRONIZAR CON GOOGLE</button>
        <button class="btn-main btn-sec" onclick="sw('pgAdmin')">AJUSTES</button>
    </div>

    <div id="pgAdmin" class="pg">
        <h2>AJUSTES</h2>
        <div class="card">
            <label>URL GOOGLE SCRIPT (/exec)</label>
            <input type="text" id="inUrl" placeholder="[link removed]">
            <button class="btn-main" onclick="saveUrl()">GUARDAR URL</button>
        </div>
    </div>
</main>

<nav id="navBar" style="display: none;">
    <button onclick="sw('vSel')"><i class="fa fa-users"></i>EQUIPO</button>
    <button onclick="sw('vJor')"><i class="fa fa-clock"></i>HOY</button>
    <button onclick="sw('vDash')"><i class="fa fa-chart-line"></i>DASH</button>
</nav>

<div id="modalPin">
    <div class="pin-box">
        <h2 id="pinName" style="border:none"></h2>
        <input type="password" id="pinInput" pattern="[0-9]*" inputmode="numeric" style="text-align:center; font-size:40px; margin-bottom:20px;">
        <button class="btn-main" onclick="checkPin()">ENTRAR</button>
        <button class="btn-main btn-sec" onclick="document.getElementById('modalPin').style.display='none'">VOLVER</button>
    </div>
</div>

<script>
// --- CONFIGURACIÓN DE TRABAJADORES ---
var W = [
  {id:1, n:'Andres', ini:'AN', c:'#E8740C', pin:'dres', admin:false},
  {id:2, n:'Ramon', ini:'RA', c:'#059669', pin:'amon', admin:false},
  {id:3, n:'Marcos', ini:'MA', c:'#7C3AED', pin:'rcos', admin:false},
  {id:4, n:'Alejandro', ini:'AL', c:'#0891B2', pin:'ndro', admin:false},
  {id:5, n:'Abdoulie', ini:'AB', c:'#D97706', pin:'ulie', admin:false},
  {id:6, n:'Alieu', ini:'AI', c:'#BE185D', pin:'lieu', admin:false},
  {id:7, n:'Ismael', ini:'IS', c:'#4F46E5', pin:'mael', admin:false},
  {id:8, n:'Fernando', ini:'FE', c:'#E8740C', pin:'ando', admin:false},
  {id:9, n:'Sergio', ini:'SE', c:'#DC2626', pin:'7777', admin:true}
];

var P = null; var tempW = null;
var gsUrl = localStorage.getItem('gs_url') || '';
var partes = JSON.parse(localStorage.getItem('pt_p')) || [];

function init() {
    renderWorkers(); resetFilters();
    document.getElementById('inUrl').value = gsUrl;
}

function renderWorkers() {
    document.getElementById('workerGrid').innerHTML = W.map(w => `
        <button class="btn-w" onclick="openPin(${w.id})">
            <div class="ini" style="background:${w.c}">${w.ini}</div>
            <div style="font-size:16px">${w.n}</div>
        </button>`).join('');
}

function openPin(id) {
    tempW = W.find(x => x.id === id);
    document.getElementById('pinName').innerText = tempW.n.toUpperCase();
    document.getElementById('pinInput').value = '';
    document.getElementById('modalPin').style.display = 'flex';
}

function checkPin() {
    if(document.getElementById('pinInput').value === tempW.pin) {
        P = tempW; document.getElementById('modalPin').style.display = 'none';
        sw(P.admin ? 'vDash' : 'vJor');
    } else { alert('PIN INCORRECTO'); }
}

function sw(id) {
    document.querySelectorAll('.pg').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('navBar').style.display = (id === 'vSel') ? 'none' : 'flex';
    if(id === 'vDash') { populateFilters(); renderDash(); }
}

function resetFilters() {
    document.getElementById('fDesde').value = "2026-05-01";
    document.getElementById('fHasta').value = "2026-05-31";
    document.getElementById('fCli').value = "ALL";
    if(P && P.admin) renderDash();
}

function populateFilters() {
    let cl = [...new Set(partes.map(p => p.cliente).filter(Boolean))].sort();
    document.getElementById('fCli').innerHTML = '<option value="ALL">-- TODOS LOS CLIENTES --</option>' + 
        cl.map(c => `<option value="${c}">${c}</option>`).join('');
}

function syncAll() {
    if(!gsUrl) return alert('CONFIGURA LA URL EN AJUSTES');
    alert('Iniciando sincronización...');
    fetch(`${gsUrl}?action=getPartes`)
    .then(r => r.json())
    .then(res => {
        if(res.status === 'ok') { 
            partes = res.partes; 
            localStorage.setItem('pt_p', JSON.stringify(partes)); 
            alert('¡ÉXITO! Descargados ' + partes.length + ' registros.');
            populateFilters(); renderDash();
        } else {
            alert('Error del script: ' + res.msg);
        }
    })
    .catch(e => alert('Fallo de conexión. Revisa la URL y el acceso del script.'));
}

function renderDash() {
    let d1 = document.getElementById('fDesde').value;
    let d2 = document.getElementById('fHasta').value;
    let fc = document.getElementById('fCli').value;

    let filtrados = partes.filter(p => (p.fecha >= d1 && p.fecha <= d2) && (fc === "ALL" || p.cliente === fc));
    
    let hT = 0; let wD = {}; let cD = {};
    filtrados.forEach(p => { 
        let h = parseFloat(p.horas) || 0;
        hT += h; 
        wD[p.nombre] = (wD[p.nombre] || 0) + h; 

        cD[p.cliente || 'OTROS'] = (cD[p.cliente || 'OTROS'] || 0) + h;
    });

    document.getElementById('stHoras').innerText = hT.toFixed(1);
    document.getElementById('stPartes').innerText = filtrados.length;
    renderBarChart('chartWorkers', wD);
    renderBarChart('chartClients', cD);
}

function renderBarChart(id, data) {
    let m = Math.max(...Object.values(data), 1);
    let entries = Object.entries(data).sort((a,b) => b[1] - a[1]);
    document.getElementById(id).innerHTML = entries.map(([k,v]) => `
        <div class="bar-container">
            <div class="bar-label"><span>${k}</span> <span>${v.toFixed(1)}h</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${(v/m)*100}%"></div></div>
        </div>`).join('') || '<p>SIN DATOS EN ESTE RANGO</p>';
}

function saveUrl() { 
    let u = document.getElementById('inUrl').value;
    if(!u.includes('/exec')) return alert('La URL debe terminar en /exec');
    localStorage.setItem('gs_url', u); 
    alert('URL GUARDADA'); location.reload(); 
}

init();
</script>
</body>
</html>
